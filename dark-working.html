<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Proms Lister — Dark</title><style>html,body{margin:0;background:#0d1014;color:#f4f1e9}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d1014}</style></head><body><iframe id="app" src="./?dark=1&delivery=20260812DARK12" title="Proms Lister"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument,s=d.createElement('style');s.textContent=`
:root{color-scheme:dark;--d-bg:#0d1014;--d-panel:#171b21;--d-panel2:#d9dde2;--d-line:#59616b;--d-text:#f4f1e9;--d-burg:#e1a1ad;--d-light:#f4f1e9}body,.page,.app-page{background:var(--d-bg)!important;color:var(--d-text)!important}.card,.sheet,.home-menu,.home-button,.panel,.concert,.row,.detail-card,.ticket-card{background:var(--d-panel)!important;color:var(--d-text)!important;border-color:#303741!important}.page-head,.topbar,header{background:#11151a!important;color:var(--d-text)!important}h1,.page-title{color:#e1a1ad!important}.muted,small,.sub,.venue,.programme,.mode-note,.count,.calendar-status{color:#9aa58f!important}.ticketbox,.tonight-banner,.drop,.syncnote{background:var(--d-light)!important;color:#171b21!important}.ticketbox *,.tonight-banner *,.drop *,.syncnote *{color:#171b21!important}.search,.search input,.ticketbox input,.ticketbox textarea,.ticketbox select,.filters input{background:#fff!important;color:#000!important;-webkit-text-fill-color:#000!important;border-color:#777!important}.search input::placeholder{color:#666!important;-webkit-text-fill-color:#666!important;opacity:1!important}.ticketbox .check,.ticketbox label,.ticketbox .field span{color:#000!important}.card .title{color:var(--d-text)!important}.card .programme,.card .venue{color:#b7b19f!important}.day,.prom-number,.time,.ticket-info,.section h3{color:#d48695!important}.sticker-red{background:#c83227!important}.sticker-ticket{background:#f3e7bd!important}button,.btn,.chip,.tool,.home-button,button *,.btn *,.chip *,.tool *,.home-button *{color:#000!important;-webkit-text-fill-color:#000!important}.btn,button,.chip,.tool{box-sizing:border-box!important;min-height:36px!important;padding:7px 11px!important;border:1px solid var(--d-line)!important;border-radius:999px!important;background:#d9dde2!important;font-weight:750!important;line-height:1.1!important;box-shadow:none!important;margin:0!important}.btn.primary,.tool.primary,.chip.active{background:#d6a4ad!important}.btn.danger,button.danger{background:#d7a0aa!important}.home-button{background:#d9dde2!important;border-radius:14px!important;min-height:56px!important;padding:11px 13px!important;text-align:left!important}.actions,.import-actions,.tools,.home-menu{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:8px!important}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}.card{border:1px solid #303741!important;border-radius:14px!important}.filters.dark-arranged{display:block!important;width:100%!important}.dark-date-row{display:grid!important;grid-template-columns:auto 145px auto 145px minmax(12px,1fr) auto auto!important;align-items:center!important;column-gap:8px!important;width:100%!important;white-space:nowrap!important}.dark-date-row>.dark-date-label{color:#9aa58f!important;font-weight:800!important;white-space:nowrap!important}.dark-date-row>input{width:145px!important;min-width:0!important;box-sizing:border-box!important}.dark-date-row>button{width:auto!important;min-width:max-content!important;white-space:nowrap!important}.dark-date-spacer{min-width:0!important}.dark-detail-top{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;margin:0 0 12px!important;padding:0 0 10px!important;border-bottom:1px solid #c9c0b2!important}.dark-detail-top button{width:100%!important}
@media(max-width:650px){.dark-date-row{grid-template-columns:auto minmax(76px,1fr) auto minmax(76px,1fr) minmax(2px,.2fr) auto auto!important;column-gap:3px!important}.dark-date-row>input{width:100%!important;font-size:12px!important;padding-left:3px!important;padding-right:3px!important}.dark-date-row>button{font-size:11px!important;padding:5px!important;min-height:32px!important}.dark-date-label{font-size:10px!important}}
`;d.head.appendChild(s);
function arrangeDays(){const down=d.getElementById('dayDown'),up=d.getElementById('dayUp'),from=d.getElementById('from'),to=d.getElementById('to'),filters=from&&from.closest('.filters');if(!down||!up||!from||!to||!filters)return;let row=d.getElementById('darkDateRow');if(!row){row=d.createElement('div');row.id='darkDateRow';row.className='dark-date-row';const fl=d.createElement('span'),tl=d.createElement('span'),sp=d.createElement('span');fl.className=tl.className='dark-date-label';sp.className='dark-date-spacer';fl.textContent='FROM';tl.textContent='TO';row.append(fl,from,tl,to,sp,up,down);filters.classList.add('dark-arranged');filters.insertBefore(row,filters.firstChild);const old=d.getElementById('dayNav');if(old&&old.children.length===0)old.remove()}}
function removeSeatplan(){d.querySelectorAll('a,button').forEach(e=>{const tx=(e.textContent||'').trim().toUpperCase(),href=(e.getAttribute('href')||'').toUpperCase();if(tx==='SEATPLAN'||tx.includes('SEATPLAN')||href.includes('SEATPLAN'))e.remove()})}
function promoteDetailButtons(){const map=d.getElementById('rahTicketPlan'),open=d.getElementById('openPdf'),box=d.querySelector('.ticketbox');if(!box||(!map&&!open))return;let top=d.getElementById('darkDetailTop');if(!top){top=d.createElement('div');top.id='darkDetailTop';top.className='dark-detail-top';box.insertBefore(top,box.firstChild)}if(map&&map.parentElement!==top)top.appendChild(map);if(open&&open.parentElement!==top)top.appendChild(open)}
const repair=()=>{arrangeDays();removeSeatplan();promoteDetailButtons();d.querySelectorAll('button,.btn,.chip,.tool,.home-button').forEach(e=>{e.style.setProperty('color','#000','important');e.style.setProperty('-webkit-text-fill-color','#000','important');e.querySelectorAll('*').forEach(x=>{x.style.setProperty('color','#000','important');x.style.setProperty('-webkit-text-fill-color','#000','important')})});d.querySelectorAll('.tonight-banner,.drop,.syncnote').forEach(box=>box.querySelectorAll('*').forEach(e=>{if(!e.matches('button,.btn,.chip,.tool'))e.style.setProperty('color','#171b21','important')}));d.querySelectorAll('.card .title').forEach(e=>e.style.setProperty('color','#f4f1e9','important'));d.querySelectorAll('.card .programme,.card .venue').forEach(e=>e.style.setProperty('color','#b7b19f','important'))};repair();new MutationObserver(()=>requestAnimationFrame(repair)).observe(d.documentElement,{subtree:true,childList:true});}catch(e){console.warn(e)}});</script></body></html>
