:root{color-scheme:dark;--d-bg:#0d1014;--d-panel:#171b21;--d-panel2:#20252c;--d-line:#303741;--d-text:#f4f1e9;--d-muted:#a8afb9;--d-burg:#df8798;--d-gold:#d8ad65}

const recolour=()=>{d.querySelectorAll('[style]').forEach(e=>{const c=(e.style.color||'').toLowerCase();if(!c)return;let m=c.match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/);if(m){const r=+m[1],g=+m[2],b=+m[3];if(r>=70&&r<=180&&g<90&&b<120)e.style.setProperty('color','#df8798','important')}else if(/^#(?:[5-9a-f][0-9a-f]0000|800020|7[0-9a-f]{5})$/i.test(c))e.style.setProperty('color','#df8798','important')})};recolour();new MutationObserver(recolour).observe(d.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['style']});
