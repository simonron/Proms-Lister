<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Proms Lister — Dark</title><style>html,body{margin:0;background:#0d1014;color:#f4f1e9}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d1014}</style></head><body><iframe id="app" src="./?dark=1&delivery=20260812DARK7" title="Proms Lister"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument,s=d.createElement('style');s.textContent=`
:root{color-scheme:dark;--d-bg:#0d1014;--d-panel:#171b21;--d-panel2:#20252c;--d-line:#303741;--d-text:#f4f1e9;--d-muted:#a8afb9;--d-burg:#d48695;--d-gold:#d8ad65}

`;d.head.appendChild(s);const recolour=()=>{d.querySelectorAll('*').forEach(e=>{if(e.closest('.ticketbox'))return;const c=getComputedStyle(e).color,m=c.match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/);if(!m)return;const r=+m[1],g=+m[2],b=+m[3];if(r>=65&&r<=190&&g<=105&&b<=135&&r>g*1.35&&r>b*1.15)e.style.setProperty('color','#d48695','important')})};recolour();new MutationObserver(()=>requestAnimationFrame(recolour)).observe(d.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']});}catch(e){console.warn(e)}});</script></body></html>
