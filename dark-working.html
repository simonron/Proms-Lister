<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Proms Lister — Dark</title><style>html,body{margin:0;background:#0d1014;color:#f4f1e9}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d1014}</style></head><body><iframe id="app" src="./?dark=1&delivery=20260812DARK8" title="Proms Lister"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument,s=d.createElement('style');s.textContent=`
:root{color-scheme:dark;--d-bg:#0d1014;--d-panel:#171b21;--d-panel2:#20252c;--d-line:#303741;--d-text:#f4f1e9;--d-muted:#a8afb9;--d-burg:#d48695;--d-gold:#d8ad65;--d-light:#f4f1e9}
body,.page,.app-page{background:var(--d-bg)!important;color:var(--d-text)!important}.card,.sheet,.home-menu,.home-button,.panel,.concert,.row,.detail-card,.ticket-card{background:var(--d-panel)!important;color:var(--d-text)!important;border-color:var(--d-line)!important}.page-head,.topbar,header{background:#11151a!important;color:var(--d-text)!important}.muted,small,.sub,.venue,.programme,.mode-note,.count,.calendar-status{color:#9aa58f!important}
/* Every genuinely light panel gets dark text. This fixes the pale banner/search/ticket areas seen in the screenshot. */
.ticketbox,.tonight-banner,.drop,.syncnote{background:var(--d-light)!important;color:#171b21!important}.ticketbox *, .tonight-banner *, .drop *, .syncnote *{color:#171b21!important}.search{background:#fff!important;color:#000!important;border-color:#777!important}.search span{color:#333!important}.search input{background:#fff!important;color:#000!important;-webkit-text-fill-color:#000!important}.search input::placeholder{color:#666!important;-webkit-text-fill-color:#666!important;opacity:1!important}
/* Form labels/fields on light surfaces. */
.ticketbox .check,.ticketbox label,.ticketbox .field span,.filters label{color:#000!important}.field,.form-field,.input-group{background:transparent!important}.ticketbox input,.ticketbox textarea,.ticketbox select,.filters input{background:#fff!important;color:#000!important;-webkit-text-fill-color:#000!important;border:1px solid #777!important}.ticketbox input::placeholder,.ticketbox textarea::placeholder{color:#555!important;-webkit-text-fill-color:#555!important;opacity:1!important}
/* Dark cards: force readable normal copy; retain burgundy only for accents. */
.card .title,.card .programme,.card .venue,.card .pdfbadge,.card .sticker-ticket{color:var(--d-text)!important}.card .programme,.card .venue{color:#b7b19f!important}.day,.prom-number,.time,.ticket-info,.section h3,.page-title{color:var(--d-burg)!important}.sticker-red{background:#c83227!important;color:#fff!important}.sticker-ticket{background:#f3e7bd!important;color:#5c2730!important}.sticker-my-prom{color:#5a3a72!important}.pdfbadge{color:#dfe8dd!important}

`;d.head.appendChild(s);
/* Remove inherited/computed colours only where they cause dark-on-dark or light-on-light collisions. */
const repair=()=>{d.querySelectorAll('.tonight-banner,.drop,.syncnote').forEach(box=>box.querySelectorAll('*').forEach(e=>{if(!e.matches('button,.btn,.chip,.tool'))e.style.setProperty('color','#171b21','important')}));d.querySelectorAll('.card .title').forEach(e=>e.style.setProperty('color','#f4f1e9','important'));d.querySelectorAll('.card .programme,.card .venue').forEach(e=>e.style.setProperty('color','#b7b19f','important'))};repair();new MutationObserver(()=>requestAnimationFrame(repair)).observe(d.documentElement,{subtree:true,childList:true});}catch(e){console.warn(e)}});</script></body></html>
