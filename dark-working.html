<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Proms Lister — Dark</title><style>html,body{margin:0;background:#0d1014;color:#f4f1e9}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d1014}</style></head><body><iframe id="app" src="./?dark=1&delivery=20260812DARK9" title="Proms Lister"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument,s=d.createElement('style');s.textContent=`
:root{color-scheme:dark;--d-bg:#0d1014;--d-panel:#171b21;--d-panel2:#d9dde2;--d-line:#59616b;--d-text:#f4f1e9;--d-muted:#a8afb9;--d-burg:#d48695;--d-light:#f4f1e9}

/* ALL buttons: black text, including primary/danger/home/day controls. */
button,.btn,.chip,.tool,.home-button,button *, .btn *, .chip *, .tool *, .home-button *{color:#000!important;-webkit-text-fill-color:#000!important}.btn,button,.chip,.tool{box-sizing:border-box!important;min-height:36px!important;padding:7px 11px!important;border:1px solid var(--d-line)!important;border-radius:999px!important;background:var(--d-panel2)!important;font-weight:750!important;line-height:1.1!important;box-shadow:none!important;margin:0!important}.btn.primary,.tool.primary,.chip.active{background:#d6a4ad!important;border-color:#a35b67!important}.btn.danger,button.danger{background:#d7a0aa!important;border-color:#89505a!important}.home-button{background:#d9dde2!important;border-radius:14px!important;min-height:56px!important;padding:11px 13px!important;text-align:left!important}.home-button small{display:block!important;margin-top:3px!important;color:#000!important}.actions,.import-actions,.tools,.home-menu{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:8px!important}.actions>*,.import-actions>*,.tools>*{width:100%!important}.ticketbox .actions{margin-top:10px!important;padding-top:10px!important;border-top:1px solid #c9c0b2!important}.ticketbox .btn{background:#fff!important}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}.card{border:1px solid #303741!important;border-radius:14px!important}

function arrangeDays(){const down=d.getElementById('dayDown'),up=d.getElementById('dayUp'),from=d.getElementById('from'),to=d.getElementById('to'),filters=from&&from.closest('.filters');if(!down||!up||!from||!to||!filters)return;let wrap=d.getElementById('darkDayInline');if(!wrap){wrap=d.createElement('span');wrap.id='darkDayInline';wrap.className='dark-day-inline';filters.appendChild(wrap)}/* place each button immediately after its date input in the grid DOM order */if(from.nextElementSibling!==down)from.insertAdjacentElement('afterend',down);if(to.nextElementSibling!==up)to.insertAdjacentElement('afterend',up);const old=d.getElementById('dayNav');if(old&&old.children.length===0)old.remove()}
const repair=()=>{arrangeDays();d.querySelectorAll('button,.btn,.chip,.tool,.home-button').forEach(e=>{e.style.setProperty('color','#000','important');e.style.setProperty('-webkit-text-fill-color','#000','important');e.querySelectorAll('*').forEach(x=>{x.style.setProperty('color','#000','important');x.style.setProperty('-webkit-text-fill-color','#000','important')})});d.querySelectorAll('.tonight-banner,.drop,.syncnote').forEach(box=>box.querySelectorAll('*').forEach(e=>{if(!e.matches('button,.btn,.chip,.tool'))e.style.setProperty('color','#171b21','important')}));d.querySelectorAll('.card .title').forEach(e=>e.style.setProperty('color','#f4f1e9','important'));d.querySelectorAll('.card .programme,.card .venue').forEach(e=>e.style.setProperty('color','#b7b19f','important'))};repair();new MutationObserver(()=>requestAnimationFrame(repair)).observe(d.documentElement,{subtree:true,childList:true});}catch(e){console.warn(e)}});</script></body></html>
