<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proms Lister slide menu preview</title><style>:root{--paper:#f6f1e4;--paper2:#efe7d4;--ink:#211c18;--maroon:#6e1f26;--deep:#4e141a;--rule:#d8cbae}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:720px;margin:auto;padding:28px 18px}.top{position:relative;min-height:48px}.toggle{width:44px;height:44px;border:0;background:transparent;border-radius:8px;font-size:29px;line-height:44px;padding:0;cursor:pointer}.toggle:hover{background:var(--paper2)}.hero{background:linear-gradient(145deg,var(--deep),var(--maroon));color:white;border-radius:22px;padding:26px 22px;text-align:center}.hero h1{font:700 clamp(34px,10vw,54px) Georgia,serif;margin:0 0 8px}.card{margin-top:22px;background:white;border:1px solid var(--rule);border-radius:14px;padding:18px}.concert-head{position:relative;min-height:50px}.concert-head .toggle{position:absolute;left:0;top:0}.concert-head h2{font:700 27px Georgia,serif;color:var(--deep);margin:8px 50px;text-align:center}.note{text-align:center;margin:24px;color:#5d6b57;font-size:13px}.shade{position:fixed;inset:0;background:#0006;opacity:0;visibility:hidden;transition:opacity .22s ease;z-index:90}.shade.open{opacity:1;visibility:visible}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(82vw,320px);background:var(--paper);border-right:1px solid var(--rule);box-shadow:8px 0 30px #0004;transform:translateX(-105%);transition:transform .24s ease;z-index:100;padding:calc(env(safe-area-inset-top) + 18px) 14px 24px}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding:0 4px 12px;margin-bottom:8px}.drawer-head strong{font:700 23px Georgia,serif;color:var(--deep)}.drawer-close{width:38px;height:38px;border:0;background:transparent;font-size:26px;border-radius:50%}.drawer-close:hover{background:var(--paper2)}.drawer button.action{display:block;width:100%;border:0;background:transparent;text-align:left;padding:14px 11px;border-radius:9px;font-size:16px;font-weight:750}.drawer button.action:hover{background:var(--paper2)}.divider{height:1px;background:var(--rule);margin:6px 0}</style></head><body><main class="page"><div class="top"><button class="toggle" onclick="openDrawer('homeDrawer')" aria-label="Menu">☰</button></div><section class="hero"><h1>BBC Proms 2026 Concert Diary</h1><p>Royal Albert Hall Proms, tickets and seat notes</p></section><section class="card"><div class="concert-head"><button class="toggle" onclick="openDrawer('concertDrawer')" aria-label="Menu">☰</button><h2>Concert display</h2></div><p>This demonstrates the same left-edge slide-in menu on a concert display.</p></section><p class="note">UI preview only — protected EXCELLENT application remains at index.html.</p></main><div id="shade" class="shade" onclick="closeDrawers()"></div><aside id="homeDrawer" class="drawer"><div class="drawer-head"><strong>Menu</strong><button class="drawer-close" onclick="closeDrawers()" aria-label="Close">×</button></div><button class="action">📥 Import &amp; Transfer</button><button class="action">📅 Calendar</button></aside><aside id="concertDrawer" class="drawer"><div class="drawer-head"><strong>Concert</strong><button class="drawer-close" onclick="closeDrawers()" aria-label="Close">×</button></div><button class="action">💾 Save Ticket</button><button class="action">📎 Attach Ticket</button><button class="action">🗑 Remove Ticket</button><button class="action">🎟 Read Seat Details</button></aside><script>function openDrawer(id){closeDrawers();document.getElementById(id).classList.add('open');document.getElementById('shade').classList.add('open');document.body.style.overflow='hidden'}function closeDrawers(){document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('open'));document.getElementById('shade').classList.remove('open');document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawers()})</script></body></html>
