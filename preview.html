<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proms Lister left menu preview</title><style>:root{--paper:#f6f1e4;--paper2:#efe7d4;--ink:#211c18;--maroon:#6e1f26;--deep:#4e141a;--rule:#d8cbae}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:720px;margin:auto;padding:28px 18px}.top{position:relative;min-height:48px}.menu{position:absolute;left:0;top:0}.toggle{width:44px;height:44px;border:0;background:transparent;border-radius:8px;font-size:29px;line-height:44px;padding:0;cursor:pointer}.toggle:hover{background:var(--paper2)}.panel{display:none;position:absolute;left:0;top:50px;min-width:245px;background:white;border:1px solid var(--rule);border-radius:12px;padding:7px;box-shadow:0 12px 30px #0003;z-index:5}.panel.open{display:block}.panel button{display:block;width:100%;border:0;background:white;text-align:left;padding:11px;border-radius:8px;font-weight:700}.panel button:hover{background:var(--paper2)}.hero{background:linear-gradient(145deg,var(--deep),var(--maroon));color:white;border-radius:22px;padding:26px 22px;text-align:center}.hero h1{font:700 clamp(34px,10vw,54px) Georgia,serif;margin:0 0 8px}.card{margin-top:22px;background:white;border:1px solid var(--rule);border-radius:14px;padding:18px}.concert-head{position:relative;min-height:50px}.concert-head h2{font:700 27px Georgia,serif;color:var(--deep);margin:8px 50px;text-align:center}.note{text-align:center;margin:24px;color:#5d6b57;font-size:13px}</style></head><body><main class="page"><div class="top"><div class="menu"><button class="toggle" onclick="toggle('home')" aria-label="Menu">☰</button><div class="panel" id="home"><button>📥 Import &amp; Transfer</button><button>📅 Calendar</button></div></div></div><section class="hero"><h1>BBC Proms 2026 Concert Diary</h1><p>Royal Albert Hall Proms, tickets and seat notes</p></section><section class="card"><div class="concert-head"><div class="menu"><button class="toggle" onclick="toggle('concert')" aria-label="Menu">☰</button><div class="panel" id="concert"><button>💾 Save Ticket</button><button>📎 Attach Ticket</button><button>🗑 Remove Ticket</button><button>🎟 Read Seat Details</button></div></div><h2>Concert display</h2></div><p>This demonstrates the same standard menu icon and left-side action on the concert display.</p></section><p class="note">UI preview only — protected EXCELLENT application code is unchanged.</p></main><script>function toggle(id){document.querySelectorAll('.panel').forEach(p=>{if(p.id!==id)p.classList.remove('open')});document.getElementById(id).classList.toggle('open')}document.addEventListener('click',e=>{if(!e.target.closest('.menu'))document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'))})</script></body></html>
