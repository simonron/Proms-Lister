name: One-shot ticket refresh and close patch
on:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and sanity-check index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="actions"><button class="btn quick" data-note="Try standing">Try standing</button><button class="btn quick" data-note="Go early">Go early</button><button class="btn primary" id="saveTicket">Save ticket</button><button class="btn" id="attachPdf">Attach Ticket</button><button class="btn" id="openPdf">Open Ticket</button><button class="btn danger" id="removeTicket">Remove ticket</button></div>'
          new='<div class="actions"><button class="btn quick" data-note="Try standing">Try standing</button><button class="btn quick" data-note="Go early">Go early</button><button class="btn primary" id="saveTicket">Save ticket</button><button class="btn" id="attachPdf">Attach Ticket</button><button class="btn" id="refreshTicket">Refresh Ticket Details</button><button class="btn" id="openPdf">Open Ticket</button><button class="btn danger" id="removeTicket">Remove ticket</button><button class="btn" id="closeTicketView">Close</button></div>'
          if old not in s: raise SystemExit('ticket action block not found')
          s=s.replace(old,new,1)
          oldbind="$('saveTicket').onclick=saveEditor;$('attachPdf').onclick=()=>{window.attachTarget=c;$('pdfPick').click()};$('openPdf').onclick=()=>openPdf(c);$('removeTicket').onclick=async()=>{const all=loadTickets();delete all[keyFor(c)];saveTickets(all);await pdfDelete(keyFor(c));closeSheet();render();writeCalendarSyncFile()};$('copySeat').onclick=()=>navigator.clipboard.writeText([c.title,t.section||t.area,t.row&&'Row '+t.row,t.seat&&'Seat '+t.seat,t.door&&'Door '+t.door].filter(Boolean).join('\\n'));"
          newbind="$('saveTicket').onclick=saveEditor;$('attachPdf').onclick=()=>{window.attachTarget=c;$('pdfPick').click()};$('refreshTicket').onclick=()=>refreshTicketDetails(c);$('openPdf').onclick=()=>openPdf(c);$('closeTicketView').onclick=closeSheet;$('removeTicket').onclick=async()=>{const all=loadTickets();delete all[keyFor(c)];saveTickets(all);await pdfDelete(keyFor(c));closeSheet();render();writeCalendarSyncFile()};$('copySeat').onclick=()=>navigator.clipboard.writeText([c.title,t.section||t.area,t.row&&'Row '+t.row,t.seat&&'Seat '+t.seat,t.door&&'Door '+t.door].filter(Boolean).join('\\n'));"
          if oldbind not in s: raise SystemExit('ticket binding block not found')
          s=s.replace(oldbind,newbind,1)
          anchor="function saveEditor(){if(!selected)return;const all=loadTickets(),k=keyFor(selected),old=all[k]||{};const t={...old,myProm:$('myProm').checked,hasTicket:$('hasTicket').checked,area:$('area').value.trim(),section:$('section').value.trim(),row:$('row').value.trim(),seat:$('seat').value.trim(),door:$('door').value.trim(),reference:$('reference').value.trim(),notes:$('notes').value.trim(),updatedAt:Date.now()};if(!t.myProm&&!t.hasTicket&&!t.area&&!t.section&&!t.row&&!t.seat&&!t.door&&!t.reference&&!t.notes&&!t.pdfName)delete all[k];else all[k]=t;saveTickets(all);render();openDetail(selected);writeCalendarSyncFile()}\n"
          addition=anchor+"""async function refreshTicketDetails(c){
 const k=keyFor(c),rec=await pdfGet(k);
 if(!rec){alert('No loaded ticket file is available for this Prom. Attach the ticket first.');return;}
 const btn=$('refreshTicket');if(btn){btn.disabled=true;btn.textContent='Refreshing…';}
 try{
  const type=rec.blob.type||mimeForName(rec.name)||'application/octet-stream';
  const isPdf=type==='application/pdf'||String(rec.name||'').toLowerCase().endsWith('.pdf');
  const pages=isPdf?await pdfPages(rec.blob):[await imageText(rec.blob)];
  let best={};
  for(const page of pages){
   const parsed=parseTicket(page);
   for(const f of ['door','section','row','seat','reference'])if(parsed[f]&&!best[f])best[f]=parsed[f];
   if(parsed.notes&&!best.notes)best.notes=parsed.notes;
  }
  const all=loadTickets(),old=all[k]||{};
  const refreshed={...old,hasTicket:true,pdfName:old.pdfName||rec.name,fileType:old.fileType||type,updatedAt:Date.now()};
  for(const f of ['door','section','row','seat','reference'])if(best[f])refreshed[f]=best[f];
  if(best.notes&&!String(refreshed.notes||'').includes(best.notes))refreshed.notes=[refreshed.notes,best.notes].filter(Boolean).join('\\n');
  all[k]=refreshed;saveTickets(all);render();openDetail(c);await writeCalendarSyncFile();
  const found=['door','section','row','seat'].filter(f=>best[f]);
  if(!found.length)alert('Ticket refreshed, but no Door / Section / Row / Seat details could be read from the stored ticket.');
 }catch(err){console.error(err);alert('Ticket refresh failed: '+(err&&err.message?err.message:err));if(btn){btn.disabled=false;btn.textContent='Refresh Ticket Details';}}
}
"""
          if anchor not in s: raise SystemExit('saveEditor anchor not found')
          s=s.replace(anchor,addition,1)
          p.write_text(s)
          PY
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\s\S]*)<\/script>/);if(!m)throw new Error('script block missing');new Function(m[1]);console.log('JavaScript syntax OK');
          NODE
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-ticket-refresh-close.yml
          git add index.html
          git commit -m "Add ticket refresh and close controls [skip ci]"
          git push origin HEAD:main
