<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proms Lister 2026</title><meta name="theme-color" content="#f6f1e4">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Proms Lister">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--paper:#f6f1e4;--paper2:#efe7d4;--ink:#211c18;--maroon:#6e1f26;--deep:#4e141a;--gold:#a9793c;--sage:#5d6b57;--rule:#d8cbae;--green:#39734a;--red:#9c2f2f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
main{max-width:900px;margin:auto;padding:12px 14px 55px}.drop{border:2px dashed var(--gold);background:#fff8e9;border-radius:14px;padding:15px;text-align:center;margin:4px 0 14px}.muted{font-size:12px;color:var(--sage)}.count{font-size:12px;color:var(--sage);font-weight:800;margin:8px 0}.day{margin:18px 3px 7px;border-bottom:1px solid var(--rule);font:700 15px Georgia,serif;color:var(--deep)}.card{position:relative;background:white;border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer}.card.ticket{border-left:7px solid var(--gold)}.top{display:flex;justify-content:space-between;gap:10px}.title{font:700 17px Georgia,serif}.time{font-size:12px;color:var(--maroon);font-weight:800}.venue{font-size:13px;color:var(--sage);margin-top:4px}.flag{position:absolute;right:9px;bottom:7px;font-size:20px;border:0;background:transparent}.empty{text-align:center;color:var(--sage);padding:50px}
.backdrop{position:fixed;inset:0;background:#211c1880;z-index:40;display:none}.backdrop.open{display:block}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:91vh;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:18px 20px 30px;transform:translateY(100%);transition:.2s}.sheet.open{transform:none}.close{float:right;border:0;background:var(--paper2);border-radius:50%;width:34px;height:34px}.sheet h2{font:700 26px Georgia,serif;color:var(--deep)}.ticketbox{background:#fff8e9;border:1px solid var(--gold);border-radius:13px;padding:13px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.field{display:block;margin-top:9px}.field span{display:block;font-size:11px;text-transform:uppercase;color:var(--sage)}.field input,.field textarea{width:100%;padding:9px;border:1px solid var(--rule);border-radius:8px;background:white}.check{display:flex;gap:8px;align-items:center;font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{border:1px solid var(--rule);background:white;border-radius:9px;padding:9px 11px;font-weight:750}.app-page{display:none;min-height:100vh}.app-page.active{display:block}.page-head{padding:12px 14px;border-bottom:2px solid var(--ink)}.page-title-row{display:flex;align-items:center;gap:10px}.page-title{flex:1}.back-home,.menu-toggle{border:1px solid var(--rule);background:white;border-radius:10px;padding:9px 12px;font-weight:800}.home-wrap{max-width:720px;margin:auto;padding:28px 18px 40px}.home-hero{background:var(--maroon);color:white;border-radius:22px;padding:26px;text-align:center}.home-menu{display:grid;gap:12px;margin-top:18px}.home-button{width:100%;text-align:left;border:1px solid var(--rule);background:white;border-radius:16px;padding:17px;font-weight:850;font-size:18px}.home-button small{display:block;font-size:12px;color:var(--sage);margin-top:4px}.home-footer{text-align:center;font-size:12px;color:var(--sage);margin-top:22px}.search{margin-top:10px;background:white;border:1px solid var(--ink);border-radius:10px;padding:9px}.search input{border:0;outline:0;width:90%}.filters{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip,.tool{border:1px solid var(--rule);background:white;border-radius:999px;padding:7px 11px;font-weight:700}.import-main,.list-main{max-width:900px;margin:auto;padding:14px}.prom-number{color:var(--maroon);font-size:12px;font-weight:900}.status-stickers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.sticker{border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;background:#eee}.arena-indicator{margin-top:12px;padding:12px;background:#eef8f0;font-weight:900;text-align:center}.menu-row,.concert-menu-row{display:flex;justify-content:flex-end;margin:0 0 10px}.concert-menu-row{margin-top:10px}.menu-wrap{display:flex;justify-content:flex-end}.menu-panel{position:fixed;left:0;top:0;bottom:0;width:min(82vw,320px);z-index:100000;background:white;border-right:2px solid var(--rule);padding:calc(env(safe-area-inset-top) + 64px) 12px calc(env(safe-area-inset-bottom) + 18px);box-shadow:8px 0 30px #0004;display:block;transform:translateX(-105%);transition:transform .24s ease;overflow-y:auto}.menu-panel.open{transform:translateX(0)}.menu-panel button{display:block;width:100%;border:0;background:white;text-align:left;padding:13px 11px;border-radius:8px;font-weight:750}.menu-panel button:hover{background:var(--paper2)}.menu-divider{height:1px;background:var(--rule);margin:7px 0}.menu-panel .danger{color:var(--red)}
@media(max-width:620px){.ticketbox>.grid,.ticket-seat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div id="homePage" class="app-page active"><div class="home-wrap"><div class="menu-row"><div class="menu-wrap"><button id="homeMenuToggle" class="menu-toggle">☰ Menu</button><div id="homeMenuPanel" class="menu-panel"><button id="homeImport">📥 Import & Transfer</button><button id="homeCalendar">📅 Calendar</button><div class="menu-divider"></div><div id="calendarStatus">Calendar sync file not connected.</div></div></div></div><section class="home-hero"><h1>BBC Proms 2026 Concert Diary</h1><p>Royal Albert Hall Proms, tickets and seat notes</p></section><nav class="home-menu"><button id="homeTonight" class="home-button">Tonight’s Prom<small>Open today’s concert</small></button><button id="homeBrowse" class="home-button">Browse Proms</button><button id="homeTickets" class="home-button">Promming & Tickets <span id="homeTicketCount"></span></button></nav><div class="home-footer">Ticket files remain on this device unless transferred using a backup.</div></div></div>
<div id="listPage" class="app-page"><header class="page-head"><div class="page-title-row"><button class="back-home" data-home>← Start</button><h1 id="listPageTitle" class="page-title">Browse Proms</h1></div><div class="search"><input id="q" placeholder="Search…"></div><div class="filters"><input id="from" type="date"><input id="to" type="date"><button class="chip" id="prevDay">− Day</button><button class="chip" id="today">Today</button><button class="chip" id="nextDay">+ Day</button><button class="chip" id="all">All dates</button><button class="chip" id="ticketOnly">Promming / Tickets</button></div></header><main class="list-main"><div id="count" class="count"></div><div id="results"></div></main></div>
<div id="importPage" class="app-page"><header class="page-head"><div class="page-title-row"><button class="back-home" data-home>← Start</button><h1 class="page-title">Import & Transfer</h1></div></header><main class="import-main"><div id="drop" class="drop"><b>Drop Royal Albert Hall ticket PDFs or Photos here</b><div id="importStatus"></div></div><button class="tool" id="choosePdf">Choose ticket PDF(s) or Photo(s)</button><button class="tool" id="exportBackup">Export backup</button><button class="tool" id="importBackup">Import backup</button><input id="pdfPick" type="file" multiple hidden><input id="backupPick" type="file" hidden></main></div>
<div id="backdrop" class="backdrop"></div><div id="sheet" class="sheet"><button id="close" class="close">×</button><div id="detail"></div></div>
<script>
let concerts=[],selected=null,ticketOnly=false;const $=id=>document.getElementById(id),STORAGE='promsTicketsV2',DB='PromsListerPDFs',STORE='pdfs';const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const keyFor=c=>String(c.id||`${c.date}|${c.time}|${c.title}`);const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});function loadTickets(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{return{}}}function saveTickets(x){localStorage.setItem(STORAGE,JSON.stringify(x))}function ticketFor(c){return loadTickets()[keyFor(c)]||{}}function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);if(!r.result.objectStoreNames.contains('settings'))r.result.createObjectStore('settings')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function pdfGet(k){const db=await dbOpen();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}async function pdfPut(k,b,n){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({blob:b,name:n},k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function pdfDelete(k){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function explicitPromNumber(c){return c._promNumber||''}function promLabel(c){return `Prom ${explicitPromNumber(c)}`}function showPage(id){document.querySelectorAll('.app-page').forEach(p=>p.classList.toggle('active',p.id===id));window.scrollTo(0,0)}function updateHome(){const n=Object.values(loadTickets()).filter(t=>t.myProm||t.hasTicket).length;$('homeTicketCount').textContent=n?`(${n})`:''}function openList(mode='all'){ticketOnly=mode==='tickets';showPage('listPage');render()}function localToday(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function shiftDate(iso,days){const base=iso?new Date(iso+'T12:00:00'):new Date(localToday()+'T12:00:00');base.setDate(base.getDate()+days);return `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(base.getDate()).padStart(2,'0')}`}function setSingleDay(iso){$('from').value=iso;$('to').value=iso;render()}function openTonight(){const today=localToday(),c=concerts.find(x=>x.date===today);if(c){showPage('listPage');openDetail(c)}}
function render(){const all=loadTickets(),q=$('q').value.toLowerCase(),from=$('from').value,to=$('to').value,list=concerts.filter(c=>{const t=all[keyFor(c)]||{};return(!from||c.date>=from)&&(!to||c.date<=to)&&(!ticketOnly||t.myProm||t.hasTicket)&&(!q||[c.title,t.section,t.row,t.seat].join(' ').toLowerCase().includes(q))});$('count').textContent=`${list.length} Royal Albert Hall concerts`;$('results').innerHTML='';let last='';for(const c of list){if(c.date!==last){const d=document.createElement('div');d.className='day';d.textContent=fmt(c.date);$('results').appendChild(d);last=c.date}const t=all[keyFor(c)]||{},el=document.createElement('article');el.className='card'+(t.hasTicket?' ticket':'');el.innerHTML=`<div class="prom-number">${promLabel(c)}</div><div class="top"><div class="title">${esc(c.title)}</div><div class="time">${esc(c.time)}</div></div><div class="venue">${esc(c.venue)}</div>${t.hasTicket?`<div class="status-stickers"><span class="sticker">${esc(t.section||'Ticket')} ${t.row?'Row '+esc(t.row):''} ${t.seat?'Seat '+esc(t.seat):''}</span></div><button class="flag">🎟</button>`:''}`;el.onclick=e=>{if(e.target.classList.contains('flag')){e.stopPropagation();openPdf(c)}else openDetail(c)};$('results').appendChild(el)}updateHome()}
function toggleMenu(panelId,toggleId,force){const p=$(panelId),b=$(toggleId);if(!p||!b)return;const open=force===undefined?!p.classList.contains('open'):!!force;p.classList.toggle('open',open);b.setAttribute('aria-expanded',open?'true':'false')}
function closeAllMenus(){toggleMenu('homeMenuPanel','homeMenuToggle',false);toggleMenu('concertMenuPanel','concertMenuToggle',false)}
async function openPdf(c){if(window.RAHTicketRepair)return window.RAHTicketRepair.openCorrectTicket(c)}
function openDetail(c){selected=c;const t=ticketFor(c),has=!!t.hasTicket,prom=!!t.myProm;const seat=has?(prom?'<div class="arena-indicator">🟢 Arena — Promming</div>':`<div class="grid ticket-seat-grid"><label class="field"><span>Section / box</span><input id="section" value="${esc(t.section||'')}"></label><label class="field"><span>Row</span><input id="row" value="${esc(t.row||'')}"></label><label class="field"><span>Seat</span><input id="seat" value="${esc(t.seat||'')}"></label><label class="field"><span>Door</span><input id="door" value="${esc(t.door||'')}"></label></div>`):'';$('detail').innerHTML=`<div class="prom-number">${promLabel(c)}</div><div>${fmt(c.date)} · ${esc(c.time)}</div><h2>${esc(c.title)}</h2><div class="ticketbox"><div class="grid"><label class="check"><input id="myProm" type="checkbox" ${prom?'checked':''}> Promming</label><label class="check"><input id="hasTicket" type="checkbox" ${has?'checked':''}> I have a ticket</label></div>${seat}<label class="field"><span>Notes</span><textarea id="notes">${esc(t.notes||'')}</textarea></label><div class="actions">${t.pdfName?'<button class="btn" id="openPdf">Open Ticket</button>':''}${has&&!prom?'<button class="btn" id="rahTicketPlan">RAH seating plan</button>':''}</div><div class="concert-menu-row"><div class="menu-wrap"><button class="menu-toggle" id="concertMenuToggle">☰ Menu</button><div class="menu-panel" id="concertMenuPanel"><button id="saveTicket">💾 Save Ticket</button><button id="attachPdf">📎 Attach Ticket</button><button id="readTicket">🎟 Read Seat Details</button><div class="menu-divider"></div><button id="removeTicket" class="danger">🗑 Remove Ticket</button></div></div></div></div>`;$('concertMenuToggle').onclick=e=>{e.stopPropagation();toggleMenu('concertMenuPanel','concertMenuToggle')};$('saveTicket').onclick=saveEditor;$('attachPdf').onclick=()=>{window.attachTarget=c;$('pdfPick').click()};$('readTicket').onclick=()=>window.RAHTicketRepair&&window.RAHTicketRepair.readTicket(c);if($('openPdf'))$('openPdf').onclick=()=>openPdf(c);if($('rahTicketPlan'))$('rahTicketPlan').onclick=showRAHPlan;$('removeTicket').onclick=async()=>{const a=loadTickets();delete a[keyFor(c)];saveTickets(a);await pdfDelete(keyFor(c));closeSheet();render()};$('myProm').onchange=saveEditor;$('hasTicket').onchange=saveEditor;$('backdrop').classList.add('open');$('sheet').classList.add('open')}
function saveEditor(){if(!selected)return;const a=loadTickets(),k=keyFor(selected),o=a[k]||{},prom=$('myProm').checked,has=$('hasTicket').checked,t={...o,myProm:prom,hasTicket:has,notes:$('notes').value};if(prom){t.section='Arena';t.row=t.seat=t.door=''}else if(has){t.section=$('section')?.value||o.section||'';t.row=$('row')?.value||o.row||'';t.seat=$('seat')?.value||o.seat||'';t.door=$('door')?.value||o.door||''}a[k]=t;saveTickets(a);render();openDetail(selected)}function closeSheet(){closeAllMenus();$('backdrop').classList.remove('open');$('sheet').classList.remove('open')}
async function importPdfs(files){for(const file of files){if(!window.attachTarget)continue;const c=window.attachTarget,k=keyFor(c),a=loadTickets(),o=a[k]||{};a[k]={...o,hasTicket:true,pdfName:file.name};saveTickets(a);await pdfPut(k,file,file.name);window.attachTarget=null}render()}
async function exportBackup(){const zip=new JSZip();zip.file('backup.json',JSON.stringify({format:'proms-lister-backup-v1',tickets:loadTickets()}));const blob=await zip.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PromsListerBackup.zip';a.click()}async function importBackup(file){const zip=await JSZip.loadAsync(file),e=zip.file('backup.json');if(e){const d=JSON.parse(await e.async('text'));saveTickets(d.tickets||{});render()}}
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>showPage('homePage'));$('homeBrowse').onclick=()=>openList('all');$('homeTickets').onclick=()=>openList('tickets');$('homeTonight').onclick=openTonight;$('homeImport').onclick=()=>{closeAllMenus();showPage('importPage')};$('homeMenuToggle').onclick=e=>{e.stopPropagation();toggleMenu('homeMenuPanel','homeMenuToggle')};document.addEventListener('click',e=>{if(!e.target.closest('.menu-panel')&&!e.target.closest('.menu-toggle'))closeAllMenus()});$('backdrop').onclick=closeSheet;$('close').onclick=closeSheet;$('q').oninput=render;$('from').onchange=render;$('to').onchange=render;$('prevDay').onclick=()=>setSingleDay(shiftDate($('from').value||$('to').value||localToday(),-1));$('today').onclick=()=>setSingleDay(localToday());$('nextDay').onclick=()=>setSingleDay(shiftDate($('to').value||$('from').value||localToday(),1));$('all').onclick=()=>{$('from').value=$('to').value='';render()};$('ticketOnly').onclick=()=>{ticketOnly=!ticketOnly;render()};$('choosePdf').onclick=()=>$('pdfPick').click();$('pdfPick').onchange=async e=>{await importPdfs([...e.target.files]);e.target.value=''};$('exportBackup').onclick=exportBackup;$('importBackup').onclick=()=>$('backupPick').click();$('backupPick').onchange=async e=>{if(e.target.files[0])await importBackup(e.target.files[0])};
function currentSeatTicket(){const t=selected?ticketFor(selected):{};return{door:$('door')?.value||t.door||'',section:$('section')?.value||t.section||'',row:$('row')?.value||t.row||'',seat:$('seat')?.value||t.seat||''}}function showRAHPlan(){let m=$('rahPlanModal');if(!m){m=document.createElement('div');m.id='rahPlanModal';m.style.cssText='position:fixed;inset:0;background:#222e;z-index:99999;display:flex;flex-direction:column';m.innerHTML='<div style="background:white;padding:8px"><button id="pc">Close</button></div><div id="pi" style="position:relative;overflow:auto"><img id="rahImg" src="rah-seating-plan2.jpeg?v=20260809A" width="1346"></div><div id="seatLabel"></div>';document.body.appendChild(m);$('pc').onclick=()=>{m.style.display='none';window.RAHSeatMap&&window.RAHSeatMap.closeCorrectionUI()}}m.style.display='flex';setTimeout(()=>{window.RAHSeatMap&&window.RAHSeatMap.setTicket(currentSeatTicket())},0)}
fetch('data.json').then(r=>r.json()).then(d=>{concerts=d.map((c,i)=>({...c,_promNumber:i+1})).filter(c=>/royal albert hall/i.test(c.venue||''));render();updateHome()});
</script><script src="rah-seating-plan.js?v=20260809A"></script></body></html>
