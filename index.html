<style>

@media(max-width:620px){.grid{grid-template-columns:1fr}.tools .tool{flex:1 1 auto}.filters{align-items:flex-end}.filters label{flex:1}.filters input{width:100%}}
</style></head><body>
<header><div class="head"><div class="row"><div><h1>Simon's Proms Lister</h1><div class="sub">Royal Albert Hall Proms, tickets and seat notes</div></div><div class="season">17 Jul–12 Sep 2026</div></div>
<div class="search"><span>⌕</span><input id="q" placeholder="Search titles, composers, performers, seats, notes…"></div>
<div class="filters"><label>From <input id="from" type="date"></label><label>To <input id="to" type="date"></label><button class="chip" id="today">Today</button><button class="chip" id="weekend">Weekend</button><button class="chip" id="all">All dates</button><button class="chip" id="ticketOnly">My tickets</button></div>
<div class="tools"><button class="tool gold" id="choosePdf">Import ticket PDF(s)</button><button class="tool" id="exportBackup">Export phone/desktop backup</button><button class="tool" id="importBackup">Import backup</button></div>
<input id="pdfPick" type="file" accept=".pdf,application/pdf" multiple hidden><input id="backupPick" type="file" accept=".zip,application/zip" hidden>
</div></header>
<main><div id="drop" class="drop"><b>Drop Royal Albert Hall ticket PDFs here</b><br><span class="muted">PDFs stay on this device unless you export a backup.</span><div id="importStatus" class="status"></div></div><div id="count" class="count">Loading…</div><div id="results"></div></main>
<div id="backdrop" class="backdrop"></div><div id="sheet" class="sheet"><button id="close" class="close">×</button><div id="detail"></div></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const STORAGE='promsTicketsV2', DB='PromsListerPDFs', STORE='pdfs';let concerts=[],selected=null,ticketOnly=false;const $=id=>document.getElementById(id);
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const keyFor=c=>String(c.id||`${c.date}|${c.time}|${c.title}`);
function loadTickets(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{return {}}}function saveTickets(x){localStorage.setItem(STORAGE,JSON.stringify(x))}function ticketFor(c){return loadTickets()[keyFor(c)]||{}}
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function pdfPut(k,b,n){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({blob:b,name:n},k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}async function pdfGet(k){const db=await dbOpen();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}async function pdfDelete(k){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function wildcard(q){const x=q.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.');try{return new RegExp(x,'i')}catch{return null}}
function render(){const q=$('q').value.trim(),re=q?wildcard(q):null,from=$('from').value,to=$('to').value,all=loadTickets();const list=concerts.filter(c=>{const t=all[keyFor(c)]||{};const hay=[c.title,c.programme,c.performers,c.venue,c.city,t.area,t.section,t.row,t.seat,t.door,t.reference,t.notes].join(' ');return(!from||c.date>=from)&&(!to||c.date<=to)&&(!re||re.test(hay))&&(!ticketOnly||t.hasTicket)});$('count').textContent=`${list.length} Royal Albert Hall concert${list.length===1?'':'s'}`;$('results').innerHTML=list.length?'':'<div class="empty">No matching concerts.</div>';let last='';for(const c of list){if(c.date!==last){const d=document.createElement('div');d.className='day';d.textContent=fmt(c.date);$('results').appendChild(d);last=c.date}const t=all[keyFor(c)]||{},att=t.hasTicket&&new Date(c.date+'T23:59:59')<new Date(),where=[t.section||t.area,t.row&&`Row ${t.row}`,t.seat&&`Seat ${t.seat}`].filter(Boolean).join(' · ');const el=document.createElement('article');el.className='card'+(t.hasTicket?' ticket':'');el.innerHTML=`<div class="top"><div class="title">${esc(c.title)}</div><div class="time">${esc(c.time)}</div></div><div class="venue">${esc(c.venue)}</div>${c.programme?`<div class="programme">${esc(c.programme)}</div>`:''}${t.hasTicket?`<div class="ticket-info">${att?'Attended':'Ticket'}${where?' · '+esc(where):''}${t.door?' · Door '+esc(t.door):''}${t.pdfName?' · PDF attached':''}</div><button class="flag" title="Open ticket PDF">${att?'✅':'🎟'}</button>`:''}`;el.onclick=e=>{if(e.target.classList.contains('flag')){e.stopPropagation();openPdf(c)}else openDetail(c)};$('results').appendChild(el)}}
async function openPdf(c){const rec=await pdfGet(keyFor(c));if(!rec){alert('No ticket PDF is attached to this concert. Open the concert and import or attach its PDF.');return}const u=URL.createObjectURL(rec.blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}
function openDetail(c){selected=c;const t=ticketFor(c);$('detail').innerHTML=`<div style="font-size:12px;color:var(--sage);text-transform:uppercase">${fmt(c.date)} · ${esc(c.time)}</div><h2>${esc(c.title)}</h2><div class="meta"><div><b>Venue</b>${esc(c.venue)}</div>${c.price?`<div><b>Price</b>${esc(c.price)}</div>`:''}</div>${c.programme?`<div class="section"><h3>Programme</h3><p>${esc(c.programme)}</p></div>`:''}${c.performers?`<div class="section"><h3>Performers</h3><p>${esc(c.performers)}</p></div>`:''}${c.broadcast?`<div class="section"><h3>Broadcast</h3><p>${esc(c.broadcast)}</p></div>`:''}<div class="ticketbox"><label class="check"><input id="hasTicket" type="checkbox" ${t.hasTicket?'checked':''}> I have a ticket</label><div class="grid"><label class="field"><span>Area</span><input id="area" value="${esc(t.area||'')}"></label><label class="field"><span>Section / box</span><input id="section" value="${esc(t.section||'')}"></label><label class="field"><span>Row</span><input id="row" value="${esc(t.row||'')}"></label><label class="field"><span>Seat</span><input id="seat" value="${esc(t.seat||'')}"></label><label class="field"><span>Door</span><input id="door" value="${esc(t.door||'')}"></label><label class="field"><span>Reference</span><input id="reference" value="${esc(t.reference||'')}"></label></div><label class="field"><span>Notes</span><textarea id="notes">${esc(t.notes||'')}</textarea></label><div class="actions"><button class="btn quick" data-note="Try standing">Try standing</button><button class="btn quick" data-note="Go early">Go early</button><button class="btn primary" id="saveTicket">Save ticket</button><button class="btn" id="attachPdf">Attach PDF</button><button class="btn" id="openPdf">Open ticket PDF</button><button class="btn danger" id="removeTicket">Remove ticket</button></div><div class="actions"><a class="btn" target="_blank" href="https://seatplan.com/london/royal-albert-hall-venue/seating-plan/">SeatPlan</a><a class="btn" target="_blank" href="https://www.royalalberthall.com/plan-your-visit-essential-safety-information/venue-and-seating-plan/">RAH seating plan</a><button class="btn" id="copySeat">Copy seat details</button></div><div class="syncnote">Use Export backup on one device, then Import backup on the other. The ZIP includes ticket details, notes and attached PDFs.</div></div>`;document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>{const n=$('notes');n.value=(n.value.trim()?n.value.trim()+'\n':'')+b.dataset.note});$('saveTicket').onclick=saveEditor;$('attachPdf').onclick=()=>{window.attachTarget=c;$('pdfPick').click()};$('openPdf').onclick=()=>openPdf(c);$('removeTicket').onclick=async()=>{const all=loadTickets();delete all[keyFor(c)];saveTickets(all);await pdfDelete(keyFor(c));closeSheet();render()};$('copySeat').onclick=()=>navigator.clipboard.writeText([c.title,t.section||t.area,t.row&&'Row '+t.row,t.seat&&'Seat '+t.seat,t.door&&'Door '+t.door].filter(Boolean).join('\n'));$('backdrop').classList.add('open');$('sheet').classList.add('open')}
function saveEditor(){if(!selected)return;const all=loadTickets(),k=keyFor(selected),old=all[k]||{};const t={...old,hasTicket:$('hasTicket').checked,area:$('area').value.trim(),section:$('section').value.trim(),row:$('row').value.trim(),seat:$('seat').value.trim(),door:$('door').value.trim(),reference:$('reference').value.trim(),notes:$('notes').value.trim()};if(!t.hasTicket&&!t.area&&!t.section&&!t.row&&!t.seat&&!t.door&&!t.reference&&!t.notes&&!t.pdfName)delete all[k];else all[k]=t;saveTickets(all);render();openDetail(selected)}
function closeSheet(){$('backdrop').classList.remove('open');$('sheet').classList.remove('open')}
async function pdfText(file){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();text+=' '+c.items.map(x=>x.str).join(' ')}return text.replace(/\s+/g,' ').trim()}
function dateFromText(text){const months={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};let m=text.match(/(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)?\s*,?\s*(\d{1,2})\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+2026/i);if(m)return`2026-${months[m[2].slice(0,3).toLowerCase()]}-${m[1].padStart(2,'0')}`;m=text.match(/(\d{1,2})[\/.](\d{1,2})[\/.]2026/);if(m)return`2026-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return''}
function norm(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9]+/g,' ').trim()}
function matchConcert(text){const date=dateFromText(text),n=norm(text);let candidates=date?concerts.filter(c=>c.date===date):concerts;let best=null,score=0;for(const c of candidates){const words=norm(c.title).split(' ').filter(w=>w.length>3);const s=words.filter(w=>n.includes(w)).length+(n.includes(norm(c.title))?10:0);if(s>score){score=s;best=c}}return score>0?best:null}
function parseTicket(text){const section=(text.match(/(?:Section|Stalls|Rausing Circle|Circle|Gallery|Arena|Choir|Grand Tier|Second Tier|Loggia|Box)\s*[:\-]?\s*([A-Z]?[A-Z0-9 ]{0,18})/i)||[]);const row=(text.match(/Row\s*[:\-]?\s*([A-Z0-9]+)/i)||[])[1]||'';const seat=(text.match(/Seat(?:s)?\s*[:\-]?\s*([A-Z0-9–\-]+)/i)||[])[1]||'';const door=(text.match(/Door\s*[:\-]?\s*([A-Z0-9]+)/i)||[])[1]||'';const ref=(text.match(/(?:Order(?: Number)?|Booking(?: Reference)?|Reference)\s*[:#\-]?\s*([A-Z0-9-]{5,})/i)||[])[1]||'';let sec='';if(section[0])sec=section[0].replace(/\s+/g,' ').trim();return{section:sec,row,seat,door,reference:ref,notes:/restricted view/i.test(text)?'Restricted view':''}}
async function importPdfs(files){let ok=0,fail=[];for(const file of files){try{const text=await pdfText(file),c=window.attachTarget||matchConcert(text);if(!c){fail.push(file.name);continue}const p=parseTicket(text),all=loadTickets(),k=keyFor(c),old=all[k]||{};all[k]={...old,...p,hasTicket:true,pdfName:file.name};saveTickets(all);await pdfPut(k,file,file.name);ok++;window.attachTarget=null}catch(e){console.error(e);fail.push(file.name)}}render();$('importStatus').textContent=`Imported ${ok} ticket PDF${ok===1?'':'s'}${fail.length?`; could not match: ${fail.join(', ')}`:''}`;if(selected)openDetail(selected)}
async function exportBackup(){const zip=new JSZip(),all=loadTickets(),manifest={format:'proms-lister-backup-v1',created:new Date().toISOString(),tickets:all};zip.file('backup.json',JSON.stringify(manifest,null,2));for(const [k,t] of Object.entries(all)){if(t.pdfName){const rec=await pdfGet(k);if(rec)zip.file('pdfs/'+encodeURIComponent(k)+'__'+rec.name,rec.blob)}}const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`PromsListerBackup_${new Date().toISOString().slice(0,10)}.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}
async function importBackup(file){const zip=await JSZip.loadAsync(file),entry=zip.file('backup.json');if(!entry)throw Error('backup.json missing');const data=JSON.parse(await entry.async('text'));if(data.format!=='proms-lister-backup-v1')throw Error('Not a Proms Lister backup');saveTickets(data.tickets||{});const folder=zip.folder('pdfs');if(folder){const jobs=[];folder.forEach((path,e)=>{if(e.dir)return;const base=path.split('/').pop(),parts=base.split('__'),k=decodeURIComponent(parts.shift()),name=parts.join('__')||'ticket.pdf';jobs.push(e.async('blob').then(b=>pdfPut(k,b,name)))});await Promise.all(jobs)}render();$('importStatus').textContent='Backup imported. Ticket flags, notes and PDFs are now available on this device.'}
$('backdrop').onclick=closeSheet;$('close').onclick=closeSheet;$('q').oninput=render;$('from').onchange=render;$('to').onchange=render;$('all').onclick=()=>{$('from').value='';$('to').value='';render()};$('today').onclick=()=>{const d=new Date().toISOString().slice(0,10);$('from').value=d;$('to').value=d;render()};$('weekend').onclick=()=>{const n=new Date(),off=(6-n.getDay()+7)%7,s=new Date(n);s.setDate(n.getDate()+off);const u=new Date(s);u.setDate(s.getDate()+1);$('from').value=s.toISOString().slice(0,10);$('to').value=u.toISOString().slice(0,10);render()};$('ticketOnly').onclick=()=>{ticketOnly=!ticketOnly;$('ticketOnly').classList.toggle('active',ticketOnly);render()};$('choosePdf').onclick=()=>{window.attachTarget=null;$('pdfPick').click()};$('pdfPick').onchange=e=>importPdfs([...e.target.files]);$('exportBackup').onclick=exportBackup;$('importBackup').onclick=()=>$('backupPick').click();$('backupPick').onchange=async e=>{try{await importBackup(e.target.files[0])}catch(err){alert('Backup import failed: '+err.message)}};const drop=$('drop');['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>importPdfs([...e.dataTransfer.files].filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'))));window.addEventListener('storage',render);window.addEventListener('focus',render);
fetch('data.json').then(r=>r.json()).then(d=>{concerts=d.filter(c=>/royal albert hall/i.test(c.venue||''));render()}).catch(()=>{$('count').textContent='';$('results').innerHTML='<div class="empty">Concert data could not be loaded. Run this through GitHub Pages or a local web server.</div>'});
</script></body></html>
