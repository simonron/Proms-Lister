<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proms Lister 2026</title></head><body>
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:2rem">Loading Proms Lister…</div>
<script>
(async()=>{
  const source=await fetch('./Proms-Lister-Calendar/index.html?vr=2.1',{cache:'no-store'});
  if(!source.ok) throw new Error('Could not load Proms Lister source: '+source.status);
  let html=await source.text();
  html=html.replace('<head>','<head><base href="/Proms-Lister/">');
  const patch=`<script>
(function(){
  async function refreshLoadedTicket(c){
    const k=keyFor(c), rec=await pdfGet(k);
    if(!rec){ alert('No loaded ticket file is available for this Prom. Attach the ticket first.'); return; }
    const btn=document.getElementById('refreshTicket');
    if(btn){ btn.disabled=true; btn.textContent='Refreshing…'; }
    try{
      const type=rec.blob.type||mimeForName(rec.name)||'application/octet-stream';
      const isPdf=type==='application/pdf'||String(rec.name||'').toLowerCase().endsWith('.pdf');
      const pages=isPdf ? await pdfPages(rec.blob) : [await imageText(rec.blob)];
      const best={};
      for(const page of pages){
        const parsed=parseTicket(page);
        for(const f of ['door','section','row','seat','reference']) if(parsed[f]&&!best[f]) best[f]=parsed[f];
        if(parsed.notes&&!best.notes) best.notes=parsed.notes;
      }
      const all=loadTickets(), old=all[k]||{};
      const refreshed={...old,hasTicket:true,pdfName:old.pdfName||rec.name,fileType:old.fileType||type,updatedAt:Date.now()};
      for(const f of ['door','section','row','seat','reference']) if(best[f]) refreshed[f]=best[f];
      if(best.notes&&!String(refreshed.notes||'').includes(best.notes)) refreshed.notes=[refreshed.notes,best.notes].filter(Boolean).join('\n');
      all[k]=refreshed;
      saveTickets(all);
      render();
      openDetail(c);
      await writeCalendarSyncFile();
      if(!['door','section','row','seat'].some(f=>best[f])) alert('Ticket refreshed, but no Door / Section / Row / Seat details could be read from the stored ticket.');
    }catch(err){
      console.error(err);
      alert('Ticket refresh failed: '+(err&&err.message?err.message:err));
      if(btn){ btn.disabled=false; btn.textContent='Refresh Ticket Details'; }
    }
  }
  const originalOpenDetail=openDetail;
  openDetail=function(c){
    originalOpenDetail(c);
    const actions=document.querySelector('#detail .ticketbox .actions');
    if(!actions) return;
    if(!document.getElementById('refreshTicket')){
      const b=document.createElement('button');
      b.className='btn'; b.id='refreshTicket'; b.textContent='Refresh Ticket Details';
      b.onclick=()=>refreshLoadedTicket(c);
      const open=document.getElementById('openPdf');
      actions.insertBefore(b,open||null);
    }
    if(!document.getElementById('closeTicketView')){
      const b=document.createElement('button');
      b.className='btn'; b.id='closeTicketView'; b.textContent='Close'; b.onclick=closeSheet;
      actions.appendChild(b);
    }
  };
})();
<\/script>`;
  html=html.replace('</body>',patch+'</body>');
  document.open(); document.write(html); document.close();
})().catch(err=>{document.body.innerHTML='<pre style="white-space:pre-wrap;padding:1rem;color:#9c2f2f">Proms Lister failed to load: '+String(err&&err.message?err.message:err)+'</pre>';});
</script>
</body></html>
