<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proms Lister 2026</title></head><body>
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:2rem">Loading Proms Lister…</div>
<script>
(async()=>{
 const r=await fetch('./Proms-Lister-Calendar/index.html?vr=2.7',{cache:'no-store'});if(!r.ok)throw Error('Could not load Proms Lister source: '+r.status);let h=await r.text();
 h=h.replace('<head>','<head><base href="/Proms-Lister/">');
 h=h.replace('<a class="btn" target="_blank" href="https://www.royalalberthall.com/plan-your-visit-essential-safety-information/venue-and-seating-plan/">RAH seating plan</a>','<button class="btn" type="button" id="rahTicketPlan">RAH seating plan</button>');
 const old='<button class="btn" id="attachPdf">Attach Ticket</button><button class="btn" id="openPdf">Open Ticket</button><button class="btn danger" id="removeTicket">Remove ticket</button>';
 const neu='<button class="btn" id="attachPdf">Attach Ticket</button><button class="btn" id="refreshTicket">Refresh Ticket Details</button><button class="btn" id="openPdf">Open Ticket</button><button class="btn danger" id="removeTicket">Remove ticket</button><button class="btn" id="closeTicketView">Close</button>';
 if(h.includes(old))h=h.replace(old,neu);
 const bind="$('attachPdf').onclick=()=>{window.attachTarget=c;$('pdfPick').click()};$('openPdf').onclick=()=>openPdf(c);";
 const bind2="$('attachPdf').onclick=()=>{window.attachTarget=c;$('pdfPick').click()};$('refreshTicket').onclick=()=>refreshTicketDetails(c);$('openPdf').onclick=()=>openPdf(c);$('closeTicketView').onclick=closeSheet;";
 if(h.includes(bind))h=h.replace(bind,bind2);
 const anchor='function closeSheet(){$(\'backdrop\').classList.remove(\'open\');$(\'sheet\').classList.remove(\'open\')}';
 const patch=`
function ticketPageScore(c,page){const text=typeof page==='string'?page:(page&&page.text)||'',n=norm(text),words=norm(c.title||'').split(' ').filter(w=>w.length>3);let s=words.filter(w=>n.includes(w)).length*3;if(c.date&&dateFromText(text)===c.date)s+=12;const m=matchConcert(text);if(m&&keyFor(m)===keyFor(c))s+=30;return s}
function bestTicketPage(c,pages,saved){const n=Number(saved||0);if(n>=1&&n<=pages.length)return n-1;let b=0,bs=-1;for(let i=0;i<pages.length;i++){const s=ticketPageScore(c,pages[i]);if(s>bs){bs=s;b=i}}return b}
async function refreshTicketDetails(c){const k=keyFor(c),rec=await pdfGet(k);if(!rec){alert('No loaded ticket file is available for this Prom.');return}try{const type=rec.blob.type||mimeForName(rec.name)||'application/octet-stream',pages=(type==='application/pdf'||String(rec.name||'').toLowerCase().endsWith('.pdf'))?await pdfPages(rec.blob):[await imageText(rec.blob)],all=loadTickets(),old=all[k]||{},idx=bestTicketPage(c,pages,old.ticketPage),best=parseTicket(pages[idx]),t={...old,hasTicket:true,pdfName:old.pdfName||rec.name,fileType:old.fileType||type,ticketPage:idx+1,updatedAt:Date.now()};for(const f of ['door','section','row','seat','reference'])if(best[f])t[f]=best[f];all[k]=t;saveTickets(all);render();openDetail(c);await writeCalendarSyncFile()}catch(e){alert('Ticket refresh failed: '+(e.message||e))}}
async function importPdfs(files){let ok=0,fail=[];for(const file of files){try{const isPdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf'),pages=isPdf?await pdfPages(file):[await imageText(file)],storedType=file.type||mimeForName(file.name)||'application/octet-stream';if(window.attachTarget){const c=window.attachTarget,idx=bestTicketPage(c,pages,0),parsed=parseTicket(pages[idx]),all=loadTickets(),k=keyFor(c),old=all[k]||{};all[k]={...old,...parsed,hasTicket:true,pdfName:file.name,fileType:storedType,ticketPage:idx+1};saveTickets(all);await pdfPut(k,new Blob([file],{type:storedType}),file.name);ok++}else for(let i=0;i<pages.length;i++){const page=pages[i],txt=typeof page==='string'?page:(page.text||''),c=matchConcert(txt);if(!c)continue;const parsed=parseTicket(page),all=loadTickets(),k=keyFor(c),old=all[k]||{};all[k]={...old,...parsed,hasTicket:true,pdfName:file.name,fileType:storedType,ticketPage:i+1};saveTickets(all);await pdfPut(k,new Blob([file],{type:storedType}),file.name);ok++}window.attachTarget=null}catch(e){fail.push(file.name);window.attachTarget=null}}render();$('importStatus').textContent=\`Imported \${ok} ticket\${ok===1?'':'s'}\`;if(selected)openDetail(selected);writeCalendarSyncFile()}
async function openPdf(c){const k=keyFor(c),rec=await pdfGet(k);if(!rec){alert('No ticket is attached to this concert.');return}const type=rec.blob.type||mimeForName(rec.name)||'application/octet-stream',blob=new Blob([rec.blob],{type}),u=URL.createObjectURL(blob),t=ticketFor(c);if(type!=='application/pdf'&&!String(rec.name||'').toLowerCase().endsWith('.pdf')){window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),120000);return}let page=Number(t.ticketPage||0);if(!page){try{const pages=await pdfPages(rec.blob),all=loadTickets(),idx=bestTicketPage(c,pages,0);page=idx+1;all[k]={...t,ticketPage:page};saveTickets(all)}catch(e){page=1}}window.open(u+'#page='+page+'&zoom=page-width','_blank');setTimeout(()=>URL.revokeObjectURL(u),300000)}
`;
 if(h.includes(anchor))h=h.replace(anchor,patch+anchor);
 const ui=`<script>
(function(){
 const IMG='/Proms-Lister/rah-seating-plan.jpg';
 function removeOld(){document.querySelectorAll('button,a').forEach(e=>{const x=(e.textContent||'').trim().toLowerCase();if(x==='try standing'||x==='go early')e.remove()})}
 function shiftDay(delta){const f=document.getElementById('from'),t=document.getElementById('to');let base=f&&f.value?new Date(f.value+'T12:00:00'):new Date();base.setDate(base.getDate()+delta);const v=base.toISOString().slice(0,10);if(f)f.value=v;if(t)t.value=v;if(typeof render==='function')render()}
 function addDayButtons(){const p=document.getElementById('listPage');if(!p||document.getElementById('dayNav'))return;const d=document.createElement('div');d.id='dayNav';d.style='display:flex;gap:8px;margin:8px 14px 14px';d.innerHTML='<button class="btn" id="dayDown">◀ Day down</button><button class="btn" id="dayUp">Day up ▶</button>';const head=p.querySelector('.page-head');if(head&&head.parentNode)head.parentNode.insertBefore(d,head.nextSibling);else p.insertBefore(d,p.firstChild);d.querySelector('#dayDown').onclick=()=>shiftDay(-1);d.querySelector('#dayUp').onclick=()=>shiftDay(1)}

 /* Coordinates are percentages of the supplied 780 x 1000 JPEG.  Directly readable/calibrated seats live here. */
 const SEAT_LOOKUP={
   'O|1|105':{x:69.2,y:33.7,kind:'mapped'}
 };
 /* Section geometry derived from the printed seat blocks on the supplied RAH plan.  It is used only when an exact lookup is absent. */
 const STALLS={
   G:{cx:34.0,cy:36.0,angle:-28,rowStep:1.18,seatStep:.62,seatBase:1},
   H:{cx:30.0,cy:51.5,angle:-4,rowStep:1.15,seatStep:.54,seatBase:31},
   J:{cx:36.5,cy:68.0,angle:28,rowStep:1.05,seatStep:.53,seatBase:45},
   K:{cx:49.0,cy:75.0,angle:0,rowStep:1.00,seatStep:.48,seatBase:56},
   L:{cx:62.5,cy:68.0,angle:-28,rowStep:1.05,seatStep:.53,seatBase:68},
   M:{cx:69.5,cy:51.5,angle:4,rowStep:1.15,seatStep:.54,seatBase:88},
   O:{cx:66.4,cy:36.0,angle:28,rowStep:1.18,seatStep:.62,seatBase:101}
 };
 function cleanSection(v){return String(v||'').toUpperCase().replace(/STALLS|SECTION|ARENA/g,'').replace(/[^A-Z]/g,'').trim()}
 function num(v){const m=String(v==null?'':v).match(/\\d+/);return m?Number(m[0]):NaN}
 function marker(ticket){
   const s=cleanSection(ticket&&(ticket.section||ticket.area)),row=num(ticket&&ticket.row),seat=num(ticket&&ticket.seat),key=s+'|'+row+'|'+seat;
   if(SEAT_LOOKUP[key])return {...SEAT_LOOKUP[key],section:s,row,seat};
   const g=STALLS[s];if(!g||!Number.isFinite(row)||!Number.isFinite(seat))return null;
   const rad=g.angle*Math.PI/180,along=(seat-g.seatBase)*g.seatStep,depth=(row-1)*g.rowStep;
   let x=g.cx+along*Math.cos(rad)-depth*Math.sin(rad),y=g.cy+along*Math.sin(rad)+depth*Math.cos(rad);
   if(x<8||x>92||y<25||y>90)return null;
   return {x,y,kind:'interpolated',section:s,row,seat};
 }
 function showPlan(c){let m=document.getElementById('rahPlanModal');if(!m){m=document.createElement('div');m.id='rahPlanModal';m.style='position:fixed;inset:0;background:#222e;z-index:99999;display:flex;flex-direction:column';m.innerHTML='<div style="background:white;padding:8px;display:flex;gap:8px;align-items:center"><strong style="flex:1">Royal Albert Hall seating plan</strong><button id="zp">＋</button><button id="zm">−</button><button id="zr">Reset</button><button id="pc">Close</button></div><div id="pv" style="flex:1;overflow:auto;text-align:center;position:relative"><div id="pi" style="position:relative;display:inline-block;transform-origin:top left"><img id="rahImg" src="'+IMG+'?v=seatmap27" style="display:block;max-width:none;width:900px"><div id="seatMark" style="display:none;position:absolute;width:18px;height:18px;margin:-9px;border-radius:50%;background:#e4002b;border:3px solid white;box-shadow:0 0 0 2px #e4002b,0 2px 8px #0008"></div></div></div><div id="seatLabel" style="background:white;padding:8px;text-align:center"></div>';document.body.appendChild(m);m._z=1;const apply=()=>m.querySelector('#pi').style.transform='scale('+m._z+')';m.querySelector('#zp').onclick=()=>{m._z=Math.min(5,m._z+.25);apply()};m.querySelector('#zm').onclick=()=>{m._z=Math.max(.5,m._z-.25);apply()};m.querySelector('#zr').onclick=()=>{m._z=1;apply()};m.querySelector('#pc').onclick=()=>m.style.display='none';m.querySelector('#pv').addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();m._z=Math.max(.5,Math.min(5,m._z+(e.deltaY<0?.15:-.15)));apply()},{passive:false});m.querySelector('#rahImg').onerror=()=>{m.querySelector('#seatLabel').textContent='Seating plan image could not be loaded.'}}m.style.display='flex';const ticket=c&&typeof ticketFor==='function'?ticketFor(c):{};const pt=marker(ticket),mark=m.querySelector('#seatMark'),label=m.querySelector('#seatLabel');if(pt){mark.style.display='block';mark.style.left=pt.x+'%';mark.style.top=pt.y+'%';m._z=2.25;m.querySelector('#pi').style.transform='scale('+m._z+')';const img=m.querySelector('#rahImg'),pv=m.querySelector('#pv');setTimeout(()=>{const iw=img.clientWidth*m._z,ih=img.clientHeight*m._z;pv.scrollLeft=Math.max(0,iw*pt.x/100-pv.clientWidth/2);pv.scrollTop=Math.max(0,ih*pt.y/100-pv.clientHeight/2)},80);label.textContent=[ticket.door&&'Door '+ticket.door,ticket.section||ticket.area,ticket.row&&'Row '+ticket.row,ticket.seat&&'Seat '+ticket.seat].filter(Boolean).join(' · ')+' — '+(pt.kind==='mapped'?'mapped seat position':'estimated from printed row/seat geometry')}else{mark.style.display='none';m._z=1;m.querySelector('#pi').style.transform='scale(1)';label.textContent=[ticket.door&&'Door '+ticket.door,ticket.section||ticket.area,ticket.row&&'Row '+ticket.row,ticket.seat&&'Seat '+ticket.seat].filter(Boolean).join(' · ')+' — seat position not yet mapped.'}}
 function addHomeLink(){const menu=document.querySelector('#homePage .home-menu'),p=document.getElementById('homePage');if((!menu&&!p)||document.getElementById('homeSeatPlan'))return;const b=document.createElement('button');b.id='homeSeatPlan';b.className=menu?'home-button':'btn';b.type='button';b.innerHTML='RAH interactive seating plan<small>Zoom the Royal Albert Hall plan and show the selected ticket seat</small>';b.onclick=e=>{e.preventDefault();e.stopPropagation();showPlan(typeof selected!=='undefined'?selected:null)};(menu||p).appendChild(b)}
 function wirePlanControls(){const b=document.getElementById('rahTicketPlan');if(b){b.type='button';b.onclick=e=>{e.preventDefault();e.stopPropagation();showPlan(typeof selected!=='undefined'?selected:null)}}}
 document.addEventListener('click',e=>{const el=e.target&&e.target.closest?e.target.closest('a,button'):null;if(!el)return;const txt=(el.textContent||'').trim();if(/^(RAH seating plan|RAH interactive seating plan)/i.test(txt)){e.preventDefault();e.stopImmediatePropagation();showPlan(typeof selected!=='undefined'?selected:null)}},true);
 const mo=new MutationObserver(()=>{removeOld();addDayButtons();addHomeLink();wirePlanControls()});mo.observe(document.documentElement,{subtree:true,childList:true});setTimeout(()=>{removeOld();addDayButtons();addHomeLink();wirePlanControls()},100);
 window.showRAHPlan=showPlan;window.RAH_SEAT_LOOKUP=SEAT_LOOKUP;
})();
<\/script>`;
 h=h.replace('</body>',ui+'</body>');
 document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<pre style="white-space:pre-wrap;padding:1rem;color:#9c2f2f">Proms Lister failed to load: '+String(e&&e.message?e.message:e)+'</pre>'});
</script></body></html>
