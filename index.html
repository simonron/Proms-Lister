<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proms Lister 2026</title></head><body>
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:2rem">Loading Proms Lister…</div>
<script>
(async()=>{
 const r=await fetch('./Proms-Lister-Calendar/index.html?vr=3.1',{cache:'no-store'});if(!r.ok)throw Error('Could not load Proms Lister source: '+r.status);let h=await r.text();
 h=h.replace('<head>','<head><base href="/Proms-Lister/"><style>.home-menu{display:grid!important;grid-template-columns:1fr!important}.grid,.import-actions,.actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important}.actions>*{width:100%!important}@media(max-width:620px){.home-menu{grid-template-columns:1fr!important}.grid,.import-actions,.actions{grid-template-columns:repeat(2,minmax(0,1fr))!important}}</style>');
 h=h.replace(/<a[^>]*href=["'][^"']*(?:seatplan|royalalberthall\.com\/plan-your-visit-essential-safety-information\/venue-and-seating-plan)[^"']*["'][^>]*>[\s\S]*?<\/a>/gi,'');
 h=h.replace(/<button[^>]*>\s*(?:Try standing|Go early)\s*<\/button>/gi,'');
 const ui=`<script src="/Proms-Lister/rah-seating-plan.js?v=20260812N"><\/script><script>
(function(){
 function selectedTicket(){try{return (typeof selected!=='undefined'&&selected&&typeof ticketFor==='function')?ticketFor(selected):{}}catch(e){return{}}}
 function showPlan(){let m=document.getElementById('rahPlanModal');if(!m){m=document.createElement('div');m.id='rahPlanModal';m.style='position:fixed;inset:0;background:#222e;z-index:99999;display:flex;flex-direction:column';m.innerHTML='<div style="background:white;padding:6px 8px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden"><strong style="flex:1;min-width:0;white-space:nowrap;font-size:clamp(14px,3.5vw,22px);overflow:hidden;text-overflow:ellipsis">Royal Albert Hall seating plan</strong><button id="zp">＋</button><button id="zm">−</button><button id="zr">Reset</button><button id="pc">Close</button></div><div id="seatLabel" style="background:white;padding:5px 8px;text-align:center;min-height:34px"></div><div id="pv" style="flex:1;overflow:auto;text-align:center;position:relative"><div id="pi" style="position:relative;display:inline-block;transform-origin:top left"><img id="rahImg" src="/Proms-Lister/rah-seating-plan2.jpeg?v=20260808G" width="1346" height="1536" style="display:block;max-width:none;width:1346px;height:1536px"></div></div>';document.body.appendChild(m);m._z=1;const apply=()=>m.querySelector('#pi').style.transform='scale('+m._z+')';m.querySelector('#zp').onclick=()=>{m._z=Math.min(6,m._z+.25);apply()};m.querySelector('#zm').onclick=()=>{m._z=Math.max(.25,m._z-.25);apply()};m.querySelector('#zr').onclick=()=>{m._z=1;apply()};m.querySelector('#pc').onclick=()=>{m.style.display='none';const b=document.getElementById('rahCorrectionBar');if(b)b.style.display='none'}}m.style.display='flex';const t=selectedTicket();setTimeout(()=>{if(window.RAHSeatMap){window.RAHSeatMap.install(t);window.RAHSeatMap.setTicket(t);window.RAHSeatMap.renderMarker();if(window.RAHSeatMap.addControls)window.RAHSeatMap.addControls()}},0)}
 function darkenRgb(rgb){const m=String(rgb||'').match(/rgba?\(\s*(\d+)\D+(\d+)\D+(\d+)/i);if(!m)return'';return 'rgb('+[m[1],m[2],m[3]].map(v=>Math.round(Number(v)*.8)).join(',')+')'}
 function darkenPast(){const results=document.getElementById('results');if(!results)return;const today=new Date();today.setHours(0,0,0,0);let past=false;[...results.children].forEach(el=>{if(el.classList.contains('day')){let txt=(el.textContent||'').trim().replace(/^[A-Za-z]{3},?\s+/,'');const d=new Date(txt);if(!isNaN(d)){d.setHours(0,0,0,0);past=d<today}return}if(el.classList.contains('card')){if(past){if(!el.dataset.pastDarkened){const darker=darkenRgb(getComputedStyle(el).backgroundColor);if(darker)el.style.setProperty('background-color',darker,'important');el.dataset.pastDarkened='1'}}else if(el.dataset.pastDarkened){el.style.removeProperty('background-color');delete el.dataset.pastDarkened}}})}
 function cleanAndArrange(){
   document.querySelectorAll('a,button').forEach(e=>{const txt=(e.textContent||'').trim().toLowerCase(),href=(e.getAttribute('href')||'').toLowerCase();if(txt==='try standing'||txt==='go early'||txt==='seatplan'||href.includes('seatplan')||href.includes('venue-and-seating-plan'))e.remove()});
   document.querySelectorAll('.home-menu').forEach(e=>{e.style.display='grid';e.style.gridTemplateColumns='1fr'});
   document.querySelectorAll('.grid,.import-actions,.actions').forEach(e=>{e.style.display='grid';e.style.gridTemplateColumns='repeat(2,minmax(0,1fr))'});
   darkenPast();
   const box=document.querySelector('.ticketbox');if(!box)return;
   let top=document.getElementById('liveTicketTop');if(!top){top=document.createElement('div');top.id='liveTicketTop';top.style='display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px';box.insertBefore(top,box.firstChild)}
   let rah=document.getElementById('rahTicketPlan');if(!rah){rah=document.createElement('button');rah.id='rahTicketPlan';rah.className='btn';rah.type='button';rah.textContent='RAH seating plan'}rah.onclick=e=>{e.preventDefault();e.stopPropagation();showPlan()};
   let refresh=document.getElementById('refreshTicket');if(!refresh){refresh=[...box.querySelectorAll('button,.btn')].find(b=>(b.textContent||'').trim().toLowerCase().includes('refresh ticket details'))||null}
   if(rah.parentNode!==top)top.appendChild(rah);if(refresh&&refresh.parentNode!==top)top.appendChild(refresh);
 }
 document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#rahTicketPlan');if(b){e.preventDefault();e.stopPropagation();showPlan()}},true);
 cleanAndArrange();setTimeout(cleanAndArrange,150);setTimeout(cleanAndArrange,700);setInterval(cleanAndArrange,1200);window.showRAHPlan=showPlan;
})();
<\/script>`;
 h=h.replace('</body>',ui+'</body>');document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<pre style="white-space:pre-wrap;padding:1rem;color:#9c2f2f">Proms Lister failed to load: '+String(e&&e.message?e.message:e)+'</pre>'});
</script></body></html>
