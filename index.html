<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proms Lister 2026</title></head><body>
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:2rem">Loading Proms Lister…</div>
<script>
(async()=>{
 const r=await fetch('./Proms-Lister-Calendar/index.html?vr=2.8',{cache:'no-store'});if(!r.ok)throw Error('Could not load Proms Lister source: '+r.status);let h=await r.text();
 h=h.replace('<head>','<head><base href="/Proms-Lister/">');
 h=h.replace('<a class="btn" target="_blank" href="https://www.royalalberthall.com/plan-your-visit-essential-safety-information/venue-and-seating-plan/">RAH seating plan</a>','<button class="btn" type="button" id="rahTicketPlan">RAH seating plan</button>');
 const old='<button class="btn" id="attachPdf">Attach Ticket</button><button class="btn" id="openPdf">Open Ticket</button><button class="btn danger" id="removeTicket">Remove ticket</button>';
 const neu='<button class="btn" id="attachPdf">Attach Ticket</button><button class="btn" id="refreshTicket">Refresh Ticket Details</button><button class="btn" id="openPdf">Open Ticket</button><button class="btn danger" id="removeTicket">Remove ticket</button><button class="btn" id="closeTicketView">Close</button>';
 if(h.includes(old))h=h.replace(old,neu);
 const bind="$('attachPdf').onclick=()=>{window.attachTarget=c;$('pdfPick').click()};$('openPdf').onclick=()=>openPdf(c);";
 const bind2="$('attachPdf').onclick=()=>{window.attachTarget=c;$('pdfPick').click()};$('refreshTicket').onclick=()=>refreshTicketDetails(c);$('openPdf').onclick=()=>openPdf(c);$('closeTicketView').onclick=closeSheet;";
 if(h.includes(bind))h=h.replace(bind,bind2);
 const ui=`<script src="/Proms-Lister/rah-seating-plan.js?v=20260812M"><\/script><script>
(function(){
 function removeOld(){document.querySelectorAll('button,a').forEach(e=>{const x=(e.textContent||'').trim().toLowerCase();if(x==='try standing'||x==='go early')e.remove()})}
 function shiftDay(delta){const f=document.getElementById('from'),t=document.getElementById('to');let base=f&&f.value?new Date(f.value+'T12:00:00'):new Date();base.setDate(base.getDate()+delta);const v=base.toISOString().slice(0,10);if(f)f.value=v;if(t)t.value=v;if(typeof render==='function')render()}
 function addDayButtons(){const filters=document.querySelector('#listPage .filters'),from=document.getElementById('from'),to=document.getElementById('to');if(!filters||!from||!to)return;let row=document.getElementById('liveDateRow');let down=document.getElementById('dayDown'),up=document.getElementById('dayUp');if(!down){down=document.createElement('button');down.className='btn';down.id='dayDown';down.textContent='◀ Day down';down.onclick=()=>shiftDay(-1)}if(!up){up=document.createElement('button');up.className='btn';up.id='dayUp';up.textContent='Day up ▶';up.onclick=()=>shiftDay(1)}if(!row){row=document.createElement('div');row.id='liveDateRow';row.style='display:grid;grid-template-columns:auto 145px auto 145px minmax(12px,1fr) auto auto;align-items:center;column-gap:8px;width:100%;white-space:nowrap;margin-bottom:18px';const fl=document.createElement('span'),tl=document.createElement('span'),sp=document.createElement('span');fl.textContent='FROM';tl.textContent='TO';fl.style=tl.style='color:var(--sage);font-size:11px;font-weight:800;white-space:nowrap';sp.style='min-width:0';const fromLabel=from.closest('label'),toLabel=to.closest('label');row.append(fl,from,tl,to,sp,up,down);filters.insertBefore(row,filters.firstChild);if(fromLabel&&fromLabel!==filters&&fromLabel.parentNode)fromLabel.remove();if(toLabel&&toLabel!==filters&&toLabel.parentNode)toLabel.remove()}else{row.append(up,down)}const old=document.getElementById('dayNav');if(old)old.remove();filters.style.display='flex';filters.style.flexWrap='wrap';filters.style.gap='7px';filters.style.alignItems='center';row.style.flex='1 0 100%'}
 function selectedTicket(){try{return (typeof selected!=='undefined'&&selected&&typeof ticketFor==='function')?ticketFor(selected):{}}catch(e){return{}}}
 function showPlan(){let m=document.getElementById('rahPlanModal');if(!m){m=document.createElement('div');m.id='rahPlanModal';m.style='position:fixed;inset:0;background:#222e;z-index:99999;display:flex;flex-direction:column';m.innerHTML='<div id="rahPlanHead" style="background:white;padding:6px 8px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden"><strong style="flex:1;min-width:0;white-space:nowrap;font-size:clamp(14px,3.5vw,22px);overflow:hidden;text-overflow:ellipsis">Royal Albert Hall seating plan</strong><button id="zp">＋</button><button id="zm">−</button><button id="zr">Reset</button><button id="pc">Close</button></div><div id="seatLabel" style="background:white;padding:5px 8px;text-align:center;min-height:34px"></div><div id="pv" style="flex:1;overflow:auto;text-align:center;position:relative"><div id="pi" style="position:relative;display:inline-block;transform-origin:top left"><img id="rahImg" src="/Proms-Lister/rah-seating-plan2.jpeg?v=20260808G" width="1346" height="1536" style="display:block;max-width:none;width:1346px;height:1536px"></div></div>';document.body.appendChild(m);m._z=1;const apply=()=>m.querySelector('#pi').style.transform='scale('+m._z+')';m.querySelector('#zp').onclick=()=>{m._z=Math.min(6,m._z+.25);apply()};m.querySelector('#zm').onclick=()=>{m._z=Math.max(.25,m._z-.25);apply()};m.querySelector('#zr').onclick=()=>{m._z=1;apply()};m.querySelector('#pc').onclick=()=>{m.style.display='none';const b=document.getElementById('rahCorrectionBar');if(b)b.style.display='none'};m.querySelector('#pv').addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();m._z=Math.max(.25,Math.min(6,m._z+(e.deltaY<0?.15:-.15)));apply()},{passive:false})}m.style.display='flex';const t=selectedTicket();setTimeout(()=>{if(window.RAHSeatMap){window.RAHSeatMap.install(t);window.RAHSeatMap.setTicket(t);window.RAHSeatMap.renderMarker();if(window.RAHSeatMap.addControls)window.RAHSeatMap.addControls()}},0)}
 function addHomeLink(){const menu=document.querySelector('#homePage .home-menu'),p=document.getElementById('homePage');if((!menu&&!p)||document.getElementById('homeSeatPlan'))return;const b=document.createElement('button');b.id='homeSeatPlan';b.className=menu?'home-button':'btn';b.type='button';b.innerHTML='RAH interactive seating plan<small>Zoom the Royal Albert Hall plan and show the selected ticket seat</small>';b.onclick=e=>{e.preventDefault();e.stopPropagation();showPlan()};(menu||p).appendChild(b)}
 function wirePlanControls(){const b=document.getElementById('rahTicketPlan');if(b){b.type='button';b.onclick=e=>{e.preventDefault();e.stopPropagation();showPlan()}}}
 const mo=new MutationObserver(()=>{removeOld();addDayButtons();addHomeLink();wirePlanControls()});mo.observe(document.documentElement,{subtree:true,childList:true});setTimeout(()=>{removeOld();addDayButtons();addHomeLink();wirePlanControls()},100);window.showRAHPlan=showPlan;
})();
<\/script>`;
 h=h.replace('</body>',ui+'</body>');document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<pre style="white-space:pre-wrap;padding:1rem;color:#9c2f2f">Proms Lister failed to load: '+String(e&&e.message?e.message:e)+'</pre>'});
</script></body></html>
