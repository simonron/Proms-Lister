<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Proms Lister — Dark Design Preview</title>
<style>
:root{color-scheme:dark;--bg:#0d1014;--panel:#171b21;--panel2:#20252c;--text:#f4f1e9;--muted:#a8afb9;--gold:#d8ad65;--red:#b84d58;--line:#303741;--green:#72bd8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:900px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 50px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800}h1{font:700 clamp(31px,7vw,48px) Georgia,serif;margin:3px 0 0}.season{color:var(--muted);font-size:13px}.search{margin:18px 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.search input{width:100%;background:none;border:0;outline:0;color:var(--text);font-size:17px}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);padding:8px 12px;font-weight:700}.chip.on{background:var(--gold);border-color:var(--gold);color:#17130d}.summary{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 10px}.summary h2{font:700 23px Georgia,serif;margin:0}.summary span{color:var(--muted);font-size:13px}.list{display:grid;gap:10px}.concert{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.concert.past{background:#111419;opacity:.72}.date{text-align:center;border-right:1px solid var(--line);padding-right:13px}.day{font-size:27px;font-weight:800;line-height:1}.month{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.12em}.title{font:700 18px Georgia,serif}.meta{color:var(--muted);font-size:13px;margin-top:5px}.tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.tag{font-size:11px;border-radius:999px;padding:4px 8px;background:var(--panel2);color:#d7dce3}.tag.ticket{color:#d8f5df;background:#173322}.arrow{color:var(--muted);font-size:25px}.today{border-color:#7f6338;box-shadow:inset 3px 0 var(--gold)}.foot{margin-top:25px;color:var(--muted);font-size:12px;text-align:center}.back{color:var(--gold);text-decoration:none;font-weight:800}
@media(max-width:560px){.concert{grid-template-columns:53px 1fr auto;gap:10px;padding:12px}.title{font-size:16px}.date{padding-right:9px}.day{font-size:23px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">Royal Albert Hall</div><h1>BBC Proms</h1></div><div class="season">2026 · Lister</div></div><div class="search"><input placeholder="Search composer, performer or work…" aria-label="Search"></div><div class="filters"><button class="chip on">Upcoming</button><button class="chip">My Proms</button><button class="chip">Tickets</button><button class="chip">This week</button><button class="chip">All concerts</button></div><div class="summary"><h2>Concerts</h2><span id="count">Loading…</span></div><section class="list" id="list"></section><div class="foot">Design preview · <a class="back" href="./">Return to working Proms Lister</a></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const month=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{month:'short'}).toUpperCase();const day=d=>new Date(d+'T12:00:00').getDate();const nice=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'});const today=new Date().toISOString().slice(0,10);
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{let a=data.filter(c=>/royal albert hall/i.test(c.venue||''));document.getElementById('count').textContent=a.length+' Royal Albert Hall Proms';document.getElementById('list').innerHTML=a.slice(0,30).map((c,i)=>`<article class="concert ${c.date<today?'past':''} ${c.date===today?'today':''}"><div class="date"><div class="month">${month(c.date)}</div><div class="day">${day(c.date)}</div><div class="meta">${nice(c.date)}</div></div><div><div class="title">${esc(c.title||'BBC Prom')}</div><div class="meta">${esc(c.time||'')} · ${esc(c.venue||'Royal Albert Hall')}</div><div class="tags">${i%4===0?'<span class="tag ticket">Ticket</span>':''}<span class="tag">Prom ${esc(c._promNumber||c.promNumber||i+1)}</span></div></div><div class="arrow">›</div></article>`).join('')}).catch(()=>{document.getElementById('count').textContent='';document.getElementById('list').innerHTML='<div class="concert"><div></div><div>Concert data could not be loaded.</div></div>'});
</script></body></html>
